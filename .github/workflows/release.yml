name: instalador

# Gera o instalador do Windows (.exe) do app Pauta.
# Em PRs que mexem em app/: o .exe fica em "Artifacts" na página da execução.
# Em tags v* (ex.: v0.1.0): cria um Release no GitHub com o .exe anexado.
on:
  pull_request:
    paths: ['app/**', '.github/workflows/release.yml']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Empacotar (electron-builder, NSIS)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Pauta-windows
          path: app/release/*.exe
          if-no-files-found: error
      - name: Release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/release/*.exe
          generate_release_notes: true
