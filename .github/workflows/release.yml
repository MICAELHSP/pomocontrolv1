name: release

# Gera o instalador do Windows (Pauta-Setup-x.y.z.exe) e anexa numa Release do GitHub.
# Dispara ao enviar uma tag vX.Y.Z ou manualmente (Actions > release > Run workflow), que cria a tag da versão do package.json.
# Opcional: segredos VITE_SUPABASE_URL e VITE_SUPABASE_KEY deixam o endereço do Supabase já embutido;
# sem eles, o app pede os dois na primeira abertura.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      # Execução manual: cria a tag vX.Y.Z (versão do package.json), porque a Release precisa de uma tag.
      - name: Criar tag da versão
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "Tag $v já existe."
          else
            git tag "$v" && git push origin "refs/tags/$v"
          fi
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
